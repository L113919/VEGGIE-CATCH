<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e3cc"><title>Veggie Catch</title><link rel="stylesheet" href="css/style.css"></head><body><main class="app"><header><h1>🥬 VEGGIE CATCH!</h1><p>Catch veggies. Avoid burgers.</p></header><section class="hud" aria-label="Game status"><div>SCORE<strong id="score">0</strong></div><div>TIME<strong id="time">30</strong></div><div>BEST<strong id="best">0</strong></div></section><div class="controls"><button id="pause" disabled>PAUSE ⏸</button><button id="end" disabled>END GAME ■</button></div><div class="arena"><canvas id="game" width="360" height="480" aria-label="Falling food game. Tap vegetables for points and avoid burgers."></canvas><div id="overlay" class="overlay"><h2 id="headline">READY?</h2><p id="message">🥬 +10 &nbsp; 🍅 +10 &nbsp; 🥕 +10<br>🍔 −15</p><button id="play">START GAME ▶</button></div></div><p class="hint">Tap or click falling food • 30 seconds</p></main><script src="js/game.js" defer></script></body></html>
